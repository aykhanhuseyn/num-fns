name: Deploy Pages

# Builds the docs/playground landing page (`site/`, see todo.md §6) and
# publishes it to GitHub Pages. `site/vite.config.ts` builds to `../site-dist`
# with `base: './'` (relative asset paths), so the output works unmodified
# under the project-page subpath (https://<owner>.github.io/num-fns/).
#
# One-time setup required in the repo: Settings -> Pages -> Build and
# deployment -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run site:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
