name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so commitlint can walk base..head on PRs.
          fetch-depth: 0

      # The Bun version decides the TypeScript version that `bun check` uses,
      # so CI takes it from package.json ("packageManager"), never "latest".
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - run: bun install --frozen-lockfile

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - run: bun run check:type

      - run: bun run lint

      - run: bun run format:check

      # README.md's status callout must name the version in package.json; the
      # `version` script syncs it after `changeset version`, this catches drift.
      - run: bun run check:readme

      - run: bun run check:circular

      # JSDoc audit (task 0.8-2): TypeDoc with warnings as errors, then every
      # public export must have a summary, @param, @returns, @throws,
      # @example and @since.
      - run: bun run check:jsdoc

      # Non-blocking — check:unused (knip) hits an unverified native-binding
      # crash in at least one sandboxed ARM64 environment; see todo.md §6.
      - run: bun run check:unused
        continue-on-error: true

      # Thresholds live in bunfig.toml ([test].coverageThreshold) and fail the
      # run, so this replaces a plain `bun test` rather than following one.
      - run: bun run test:coverage

      - run: bun run build

      # Lints the published surface off the dist/ built above: attw packs a
      # tarball and checks that types resolve for ESM, CJS, bundler *and*
      # legacy node10 consumers (its default `strict` profile — nothing is
      # ignored), publint checks the package.json itself. Needs a prior
      # `bun run build`.
      - run: bun run check:pack

      # attw/publint reason about the tarball statically; this installs it into
      # throwaway ESM and CJS consumer projects and actually runs them, plus a
      # `moduleResolution: nodenext` typecheck of the shipped declarations
      # (`--types`, which needs a modern tsc and so only runs here, not in the
      # version matrix below).
      - run: bun run check:smoke

      - run: bun run size

      # Benchmarks (docs/development-plan.md, task 0.7-0). The table is kept
      # as a run artifact so a slow-down can be traced to a commit; the
      # committed reference is bench/BASELINE.md. Not a gate: CI runners are
      # too noisy for a threshold, the rule is "compare before/after on one
      # machine and explain anything over 10 % in the changeset".
      - name: Benchmarks
        run: BENCH_FORMAT=markdown bun run bench | tee bench-results.md

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results.md
          retention-days: 30

      # The tarball the smoke matrix installs. Packed once here so every matrix
      # job tests the same bytes, and so the matrix needs neither bun nor a
      # build — just a Node version and `npm install <tarball>`.
      - name: Pack tarball for the version matrix
        # npm pack does not create --pack-destination itself — without the
        # mkdir it dies with ENOENT opening tarball/num-fns-<version>.tgz.
        run: |
          mkdir -p tarball
          npm pack --ignore-scripts --pack-destination tarball

      - uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: tarball/*.tgz
          retention-days: 1
          if-no-files-found: error

  # Backs the `engines.node` claim in package.json with an actual run on every
  # major it covers, and checks the two platforms the Linux job can't (path
  # separators in `exports` resolution are the realistic Windows risk). Only
  # the runtime fixtures run here — see the `--types` note above.
  #
  # `engines.node` is `>=20` (0.7.0, docs/development-plan.md task 0.7-5):
  # Node 18 reached end-of-life in April 2025. The build still targets es2018
  # and needs only `BigInt` (Node 10.4+), so the package very likely keeps
  # working on 18; it just stops promising it. The matrix is the claim.
  smoke:
    name: smoke (node ${{ matrix.node-version }}, ${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      # One old Node failing should still report the rest, not cancel them.
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node-version: ['20', '22', '24']
        include:
          - { os: macos-latest, node-version: '22' }
          - { os: windows-latest, node-version: '22' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@v4
        with:
          name: package-tarball
          path: tarball

      # `scripts/smoke.mjs` is dependency-free and written to parse on the
      # oldest major in this matrix, so it runs straight from the checkout with
      # no install step.
      - name: Run consumer fixtures against the packed tarball
        shell: bash
        run: node scripts/smoke.mjs --tarball "$(ls tarball/*.tgz)"
