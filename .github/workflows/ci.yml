name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so commitlint can walk base..head on PRs.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Lint commit messages
        if: github.event_name == 'pull_request'
        run: bunx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - run: bun run check:type

      - run: bun run lint

      - run: bun run format:check

      # Non-blocking for now — see todo.md §6 for why (typescript-estree/TS7
      # incompatibility for check:circular; unverified native-binding crash
      # for check:unused in at least one sandboxed ARM64 environment).
      - run: bun run check:circular
        continue-on-error: true

      - run: bun run check:unused
        continue-on-error: true

      - run: bun test

      - run: bun run build
