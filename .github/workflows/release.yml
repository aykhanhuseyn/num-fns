name: Release

# Changesets-driven release flow. On every push to main:
#   - if there are pending changeset files, changesets/action opens/updates
#     a "chore: version packages" PR that runs `bun run version`
#     (`changeset version`) to bump package.json, write CHANGELOG.md, and
#     consume the changeset files;
#   - once that PR is merged (so no changesets remain), changesets/action
#     instead runs `bun run release` (build + `changeset publish`), which
#     publishes to npm and creates the matching git tag + GitHub release.
#
# Requires an `NPM_TOKEN` repository secret (an npm automation/publish
# token) with permission to publish the `num-fns` package. `id-token: write`
# plus `NPM_CONFIG_PROVENANCE: true` is what lets npm attach a provenance
# attestation during `changeset publish` (which shells out to `npm publish`
# under the hood).
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check:type

      - run: bun run lint

      - run: bun run format:check

      # Non-blocking for now — see todo.md §6.
      - run: bun run check:circular
        continue-on-error: true

      - run: bun run check:unused
        continue-on-error: true

      - run: bun test

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
