name: Release

# Changesets-driven release flow. On every push to main:
#   - if there are pending changeset files, changesets/action opens/updates
#     a "chore: version packages" PR that runs `bun run version`
#     (`changeset version`) to bump package.json, write CHANGELOG.md, and
#     consume the changeset files;
#   - once that PR is merged (so no changesets remain), changesets/action
#     instead runs `bun run release` (build + `changeset publish`), which
#     publishes to npm and creates the matching git tag + GitHub release.
#
# Authentication is npm **trusted publishing** (OIDC) — there is no NPM_TOKEN
# secret. npm verifies the GitHub Actions identity of this workflow directly,
# so the trusted publisher configured at
# https://www.npmjs.com/package/num-fns/access must name:
#   provider = GitHub Actions, org/user = aykhanhuseyn,
#   repository = num-fns, workflow filename = release.yml
# Renaming this file breaks publishing until the npm setting is updated.
#
# OIDC requires npm >= 11.5.1 and Node >= 22.14.0, and only works on
# GitHub-hosted runners. Provenance attestations are generated automatically.
#
# Dist-tag note: changesets pre mode was exited on 2026-08-25 and 0.2.0 is the
# first stable version, so `changeset publish` now publishes to `latest`
# normally. Nothing here needs a --tag. (While the repo was in pre mode it
# also published to `latest`, deliberately — changesets does that when no
# regular release exists yet — which is why npm's `latest` pointed at
# 0.2.0-alpha.0. The stable publish overwrites it, as intended.)
#
# To cut another prerelease line later, `bunx changeset pre enter <tag>`;
# don't force a dist-tag in this workflow.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No `registry-url` here, deliberately: setting it makes setup-node
      # write an .npmrc with `_authToken=${NODE_AUTH_TOKEN}` and export a
      # placeholder NODE_AUTH_TOKEN (XXXXX-...). npm then authenticates with
      # that dummy token instead of doing the OIDC trusted-publishing
      # exchange, and the registry masks the unauthorized PUT as a 404
      # (seen on the first real publish attempt, 2026-08-21). With no token
      # configured, npm >= 11.5.1 on a GitHub-hosted runner detects
      # `id-token: write` and mints its own credentials.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Node 24 ships npm 11.x, but pin the floor explicitly: OIDC trusted
      # publishing is only supported from npm 11.5.1 onward.
      - name: Ensure npm supports OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check:type

      - run: bun run lint

      - run: bun run format:check

      - run: bun run check:circular

      # Non-blocking — check:unused (knip) hits an unverified native-binding
      # crash in at least one sandboxed ARM64 environment; see todo.md §6.
      - run: bun run check:unused
        continue-on-error: true

      - run: bun test

      - run: bun run build

      # Fail here rather than half-way through `npm publish`: `changeset
      # publish` triggers `prepublishOnly`, which runs this same gate, but a
      # packaging error surfacing at that point aborts a release already in
      # flight. Needs the build above.
      - run: bun run check:pack

      # Installs the tarball into real ESM/CJS consumer projects and runs them.
      # Same reasoning as check:pack above — a packaging break should stop the
      # release here, not half-way through `npm publish`.
      - run: bun run check:smoke

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      # npm's OIDC trusted-publishing exchange logs its failure reason only
      # at verbose/silly level, which lands in the debug log file rather than
      # the console — an exchange rejection surfaces as a bare ENEEDAUTH/404.
      # Dump the relevant lines so a failed publish is diagnosable from the
      # run page. Remove once the first OIDC publish has gone through.
      - name: Dump npm OIDC diagnostics on failure
        if: failure()
        run: |
          grep -rhiE 'oidc|token exchange|workflow_ref|audience' /home/runner/.npm/_logs/ | tail -n 40 || true
          echo '--- last debug log tail ---'
          tail -n 40 /home/runner/.npm/_logs/*-debug-0.log || true
