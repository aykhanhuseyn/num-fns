name: Release

# Changesets-driven release flow. On every push to main:
#   - if there are pending changeset files, changesets/action opens/updates
#     a "chore: version packages" PR that runs `bun run version`
#     (`changeset version`) to bump package.json, write CHANGELOG.md, and
#     consume the changeset files;
#   - once that PR is merged (so no changesets remain), changesets/action
#     instead runs `bun run release` (build + `changeset publish`), which
#     publishes to npm and creates the matching git tag + GitHub release.
#
# Authentication is npm **trusted publishing** (OIDC) — there is no NPM_TOKEN
# secret. npm verifies the GitHub Actions identity of this workflow directly,
# so the trusted publisher configured at
# https://www.npmjs.com/package/num-fns/access must name:
#   provider = GitHub Actions, org/user = aykhanhuseyn,
#   repository = num-fns, workflow filename = release.yml
# Renaming this file breaks publishing until the npm setting is updated.
#
# OIDC requires npm >= 11.5.1 and Node >= 22.14.0, and only works on
# GitHub-hosted runners. Provenance attestations are generated automatically.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Node 24 ships npm 11.x, but pin the floor explicitly: OIDC trusted
      # publishing is only supported from npm 11.5.1 onward.
      - name: Ensure npm supports OIDC
        run: |
          npm install -g npm@latest
          npm --version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run check:type

      - run: bun run lint

      - run: bun run format:check

      - run: bun run check:circular

      # Non-blocking — check:unused (knip) hits an unverified native-binding
      # crash in at least one sandboxed ARM64 environment; see todo.md §6.
      - run: bun run check:unused
        continue-on-error: true

      - run: bun test

      - run: bun run build

      # Fail here rather than half-way through `npm publish`: `changeset
      # publish` triggers `prepublishOnly`, which runs this same gate, but a
      # packaging error surfacing at that point aborts a release already in
      # flight. Needs the build above.
      - run: bun run check:pack

      - name: Create release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
