name: Feature request
description: A new function or a new option.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before 1.0.0 the API is frozen: no new domain and no new locale (see ROADMAP.md).
        A good idea still helps — it goes to the `after-1.0` milestone.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you want to do that num-fns cannot do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: The call and its output.
      render: ts
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Your workaround, or another library that does it.
