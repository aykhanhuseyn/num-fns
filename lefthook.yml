# https://lefthook.dev/configuration/
#
# Installed automatically by the `prepare` script in package.json (`bun install`
# runs it for you). To (re)install by hand: `bun run lefthook install`.
#
# Personal, uncommitted overrides go in `lefthook-local.yml` (gitignored).

pre-commit:
  commands:
    biome:
      glob: '*.{js,jsx,ts,tsx,json,jsonc,md}'
      run: bun run check:biome -- {staged_files}
      stage_fixed: true
    type:
      glob: '*.{ts,tsx}'
      run: bun run check:type
    circular:
      glob: '*.{ts,tsx}'
      # Do not simplify this to a bare `bun run check:circular`: it hangs the
      # hook forever at ~100% CPU. dpdm starts an `ora` spinner unconditionally
      # (not gated by `--progress`), lefthook hands each command a pty whose
      # window size it never sets, and ora's line-clearing math reads
      # `stream.columns ?? 80` — a fallback that catches null/undefined but not
      # `0`. So `Math.ceil(width / 0)` is Infinity, and ora emits cursor-up +
      # clear-line escapes without end. Capturing the output makes both streams
      # pipes, so no spinner starts; it is replayed only when the check fails.
      run: |
        if ! out=$(bun run check:circular 2>&1); then
          printf '%s\n' "$out"
          exit 1
        fi
    unused:
      glob: '*.{ts,tsx}'
      run: bun run check:unused

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}
