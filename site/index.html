<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>num-fns — number utilities for JavaScript &amp; TypeScript</title>
    <meta
      name="description"
      content="Modern, internationalized number utility library for JavaScript & TypeScript. Format and parse numbers, money and percentages; spell numbers out in words; ordinals, notation, roman numerals, arithmetic, statistics and financial helpers. Docs with live, runnable examples."
    />

    <!-- Icons. Paths are public/ assets; Vite rewrites the leading slash to the
         configured `base` ('./'), so they resolve under the GitHub Pages
         project subpath as well as at a domain root. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#1f2e45" />

    <!-- Social cards. `og:image` is never rewritten by the bundler and link
         scrapers do not resolve relative URLs, so these stay absolute and must
         be updated if the site ever moves off GitHub Pages. -->
    <link rel="canonical" href="https://aykhanhuseyn.github.io/num-fns/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="num-fns" />
    <meta property="og:title" content="num-fns — number utilities for JavaScript &amp; TypeScript" />
    <meta
      property="og:description"
      content="Like date-fns, but for numbers. Format and parse numbers, money and percentages; spell numbers out in words; ordinals, notation, roman numerals, arithmetic, statistics and financial helpers."
    />
    <meta property="og:url" content="https://aykhanhuseyn.github.io/num-fns/" />
    <meta property="og:image" content="https://aykhanhuseyn.github.io/num-fns/banner.png" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="640" />
    <meta property="og:image:alt" content="num-fns" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="num-fns — number utilities for JavaScript &amp; TypeScript" />
    <meta
      name="twitter:description"
      content="Like date-fns, but for numbers. Format and parse numbers, money and percentages; spell numbers out in words; ordinals, notation, roman numerals, arithmetic, statistics and financial helpers."
    />
    <meta name="twitter:image" content="https://aykhanhuseyn.github.io/num-fns/banner.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
